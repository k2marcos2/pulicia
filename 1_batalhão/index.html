<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist - Cautela de Viaturas</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
</head>

<body>
  <a href="../index.html" class="btn-voltar">&larr; Voltar ao Menu</a>

  <h2>Checklist de Cautela de Viaturas - 1º BPM</h2>

  <div class="alerta-limite">
    ⚠️ <strong>Aviso:</strong> Este formulário permite no máximo <strong>8 fotos capturadas pela câmera</strong>.
  </div>

  <form id="checklist-form">

    <label>Nome Completo*</label>
    <input type="text" name="Motorista" required>

    <label>Posto/Graduação*</label>
    <input type="text" name="PostoGraduacao" required>

    <label>RG-Militar*</label>
    <input type="text" name="RG-Militar" required>

    <label>Matricula*</label>
    <input type="text" name="Matricula" required>

    <label>Data e Hora da Cautela*</label>
    <input type="text" name="DataCautela" placeholder="DD/MM/AAAA ou DDMMAAAA"
           pattern="\d{2}/\d{2}/\d{4}|\d{8}" required>
    <input type="time" name="HoraCautela" min="00:00" max="23:59" required>

    <label>Validade da CNH*</label>
    <input type="text" name="ValidadeCNH" placeholder="DD/MM/AAAA ou DDMMAAAA"
           pattern="\d{2}/\d{2}/\d{4}|\d{8}" required>

    <label>Categoria da CNH*</label>
    <select name="CategoriaCNH" required>
      <option value="">Selecione...</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="AB">AB</option>
      <option value="C">C</option>
      <option value="AC">AC</option>
      <option value="D">D</option>
      <option value="AD">AD</option>
      <option value="E">E</option>
      <option value="AE">AE</option>
    </select>

    <label>Veículo*</label>
    <select name="Veiculo" required>
      <option value="">Selecione...</option>
      <option value="Duster">Duster</option>
      <option value="Gol">Gol</option>
      <option value="Polo">Polo</option>
      <option value="L200 Triton">L200 Triton</option>
      <option value="Ranger">Ranger</option>
      <option value="XRE 300">XRE 300</option>
      <option value="VAN">VAN</option>
      <option value="Micro-onibus">Micro-onibus</option>
      <option value="Yaris">Yaris</option>
      <option value="Quadriciclo">Quadriciclo</option>
      <option value="Corolla">Corolla</option>
    </select>

    <label>Prefixo*</label>
    <input type="text" name="Prefixo" required>

    <label>Placa*</label>
    <input type="text" name="Placa" required>

    <label>Km Atual*</label>
    <input type="number" name="KmAtual" required>

    <label>Km da Próx. Revisão</label>
    <input type="number" name="KmProxRevisao" required>

    <label>Nível de Água do Radiador</label>
    <select name="NivelAgua" required>
      <option>Normal</option>
      <option>Baixo</option>
    </select>

    <label>Nível do Óleo do Motor*</label>
    <select name="NivelOleo" required>
      <option>Normal</option>
      <option>Baixo</option>
    </select>

    <!-- ✅ OUTRO (Combustível) -->
    <label>Nível do Combustível*</label>
    <select name="NivelCombustivel" id="NivelCombustivel" class="select-outro" data-outro="NivelCombustivelOutroBox" required>
      <option>1/1</option>
      <option>3/4</option>
      <option>1/2</option>
      <option>1/4</option>
      <option>Reserva</option>
      <option>Outro</option>
    </select>

    <div id="NivelCombustivelOutroBox" style="display:none;">
      <label>Descreva o nível do combustível*</label>
      <input type="text" name="NivelCombustivelOutro" id="NivelCombustivelOutro" placeholder="Ex: 2/8, quase vazio...">
    </div>

    <!-- ✅ OUTRO (Pneus) -->
    <label>Pneus*</label>
    <select name="Pneus" id="Pneus" class="select-outro" data-outro="PneusOutroBox" required>
      <option>Bons</option>
      <option>Gastos/careca</option>
      <option>Outro</option>
    </select>

    <div id="PneusOutroBox" style="display:none;">
      <label>Descreva os pneus*</label>
      <input type="text" name="PneusOutro" id="PneusOutro" placeholder="Ex: dianteiro careca, rasgado...">
    </div>

    <!-- ✅ OUTRO (Giroflex/Sirene) -->
    <label>Giroflex e Sirene*</label>
    <select name="GiroflexSirene" id="GiroflexSirene" class="select-outro" data-outro="GiroflexSireneOutroBox" required>
      <option>Funcionam</option>
      <option>Giroflex danificado</option>
      <option>Sirene danificada</option>
      <option>Nenhum funciona</option>
      <option>Outro</option>
    </select>

    <div id="GiroflexSireneOutroBox" style="display:none;">
      <label>Descreva (Giroflex/Sirene)*</label>
      <input type="text" name="GiroflexSireneOutro" id="GiroflexSireneOutro" placeholder="Ex: sirene baixa, giroflex não liga...">
    </div>

    <label>Lâmpadas queimadas</label>
    <textarea name="LampadasQueimadas" rows="3" required></textarea>

    <!-- ✅ OUTRO (Parabrisa) -->
    <label>Parabrisa*</label>
    <select name="Parabrisa" id="Parabrisa" class="select-outro" data-outro="ParabrisaOutroBox" required>
      <option>Perfeito estado</option>
      <option>Danificado</option>
      <option>Outro</option>
    </select>

    <div id="ParabrisaOutroBox" style="display:none;">
      <label>Descreva o parabrisa*</label>
      <input type="text" name="ParabrisaOutro" id="ParabrisaOutro" placeholder="Ex: trincado lado direito...">
    </div>

    <!-- ✅ OUTRO (Rádio) -->
    <label>Rádio*</label>
    <select name="Radio" id="Radio" class="select-outro" data-outro="RadioOutroBox" required>
      <option>Funcionando</option>
      <option>Não funciona</option>
      <option>Outro</option>
    </select>

    <div id="RadioOutroBox" style="display:none;">
      <label>Descreva o rádio*</label>
      <input type="text" name="RadioOutro" id="RadioOutro" placeholder="Ex: chiando, sem áudio...">
    </div>

    <label>Equipamentos Obrigatórios</label>
    <div class="checkbox-group" required>
      <label><input type="checkbox" name="EquipamentosObrigatorios" value="Chave de roda"> Chave de roda</label>
      <label><input type="checkbox" name="EquipamentosObrigatorios" value="Macaco"> Macaco</label>
      <label><input type="checkbox" name="EquipamentosObrigatorios" value="Pneu de step"> Pneu de step</label>
      <label><input type="checkbox" name="EquipamentosObrigatorios" value="Triângulo"> Triângulo</label>
      <label><input type="checkbox" name="EquipamentosObrigatorios" value="Cones"> Cones</label>
    </div>

    <label>Quantidade de Cones</label>
    <input type="number" name="QtdCones" required>

    <label>Outros Problemas - Descrever</label>
    <textarea name="OutrosProblemas" rows="4"></textarea>

    <!-- 📷 Viatura -->
    <label>Fotos da Viatura</label>
    <button type="button" id="abrir-camera-viatura">📷 Abrir Câmera</button>
    <div id="camera-container-viatura" style="display:none;">
      <video id="camera-viatura" autoplay playsinline muted></video>
      <button type="button" id="tirar-foto-viatura">📸 Tirar Foto</button>
      <button type="button" id="fechar-camera-viatura">❌ Fechar Câmera</button>
    </div>
    <div id="previews-viatura"></div>

    <!-- 📷 Cartão de Abastecimento -->
    <label>Foto do Cartão de Abastecimento</label>
    <button type="button" id="abrir-camera-cartao">📷 Abrir Câmera</button>
    <div id="camera-container-cartao" style="display:none;">
      <video id="camera-cartao" autoplay playsinline muted></video>
      <button type="button" id="tirar-foto-cartao">📸 Tirar Foto</button>
      <button type="button" id="fechar-camera-cartao">❌ Fechar Câmera</button>
    </div>
    <div id="previews-cartao"></div>

    <!-- 📂 Fotos extras -->
    <label>Selecionar fotos da galeria</label>
    <input type="file" id="midia" name="midia" accept="image/*" multiple>

    <!-- ✍ Assinatura -->
    <label>Assinatura:</label>
    <canvas id="signature-pad"></canvas>
    <input type="hidden" name="AssinaturaBase64" id="assinatura-base64" required>
    <button type="button" id="clear-signature">Limpar Assinatura</button>

    <br><br>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
      <button type="submit" id="submit-btn">Enviar</button>
      <small class="envio-aviso">O envio pode levar até 1 minuto.</small>
    </div>

  </form>

  <script src="base.js"></script>
</body>
</html>
